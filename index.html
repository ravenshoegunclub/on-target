<!doctype html>
<html lang="en-AU">
<head>
  <!-- On Target v1.2.0 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>On Target · Ravenshoe &amp; District Sporting Shooters</title>
  <meta name="description" content="The Ravenshoe &amp; District Sporting Shooters club app: events, results, photos and news.">
  <meta name="theme-color" content="#5C0F1F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="On Target">
  <link rel="manifest" href="manifest.webmanifest?v=1.2.0">
  <link rel="icon" type="image/png" href="icons/favicon-48.png?v=1.2.0">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1.2.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.2.0">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="icons/icon-192.png?v=1.2.0" alt="" width="96" height="96">
    <div class="splash-name">ON TARGET</div>
    <div class="splash-sub">RAVENSHOE &amp; DISTRICT · Q48</div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/favicon-48.png?v=1.2.0" alt="" width="36" height="36">
        <div class="brand-text">
          <div class="brand-name">ON TARGET</div>
          <div class="brand-sub">RAVENSHOE &amp; DISTRICT · Q48</div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="committeeBtn" aria-label="Committee sign-in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>Home</a>
      <a href="#/events" data-tab="events"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>Events</a>
      <a href="#/results" data-tab="results"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>Results</a>
      <a href="#/photos" data-tab="photos"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></span>Photos</a>
      <a href="#/committee" data-tab="committee" id="committeeTab" hidden><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>Committee</a>
      <a href="#/more" data-tab="more"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>More</a>
    </nav>
  </div>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <form class="sheet-panel" id="signInForm" novalidate>
      <h2 id="sheetTitle">Committee sign-in</h2>
      <p id="signInNote" class="notice" hidden></p>
      <label class="field-label" for="pinBox">Your committee PIN</label>
      <input class="field pin-box" id="pinBox" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" aria-describedby="signInError">
      <p id="signInError" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-big" id="signInBtn">Sign in</button>
      <button type="button" class="btn btn-outline btn-big" id="sheetClose">Cancel</button>
    </form>
  </div>

  <div id="soonSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="soonTitle" hidden>
    <div class="sheet-panel">
      <h2 id="soonTitle">Coming soon</h2>
      <p>Coming soon – use the current On Target app for now.</p>
      <a class="btn btn-primary btn-big" id="soonLink" target="_blank" rel="noopener">Open the current On Target app</a>
      <button type="button" class="btn btn-outline btn-big" id="soonClose">Close</button>
    </div>
  </div>

  <script src="app.js?v=1.2.0"></script>
</body>
</html>
